version: "2"
linters:
  default: all
  disable:
    - embeddedstructfieldcheck
    - exhaustruct_v5
    - funcorder
    - godoclint
    - intrange
    - modernize
    - noinlineerr
    - recvcheck
    - testifylint
    - wsl_v5
    - depguard
    - dupl
    - err113
    - exhaustruct
    - forbidigo
    - forcetypeassert
    - gochecknoglobals
    - gochecknoinits
    - gomoddirectives
    - ireturn
    - lll
    - mnd
    - nestif
    - nilerr
    - nlreturn
    - nonamedreturns
    - paralleltest
    - revive
    - testpackage
    - thelper
    - varnamelen
    - wrapcheck
    - wsl
  settings:
    cyclop:
      max-complexity: 26
    funlen:
      lines: 150
      statements: 80
    gocognit:
      min-complexity: 45
    godox:
      keywords:
        - BUG
        - FIXME
  exclusions:
    generated: lax
    rules:
      - path: crypto/key_clear.go
        text: SA1019
      - path: crypto/crypto_example_test.go
        text: 'G101: Potential hardcoded credentials'
      - path: crypto/encrypt_decrypt_test.go
        text: Using the variable on range scope
      - path: crypto/encrypt_decrypt_err_test.go
        text: Using the variable on range scope
      - path: crypto/sign_verify_test.go
        text: Using the variable on range scope
      - path: (.+)\.go$
        text: Using the variable on range scope `tt` in function literal
      - path: (.+)\.go$
        text: GetJsonSHA256Fingerprints should be GetJSONSHA256Fingerprints
      - path: (.+)\.go$
        text: ST1003
      - path: (.+)\.go$
        text: missing output for example, go test can't validate it
      - path: (.+)\.go$
        text: variable 'hasExpiredEntity' is only used in the if-statement
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
